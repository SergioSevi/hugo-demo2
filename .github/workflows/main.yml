name: Update paper feed

on:
  workflow_dispatch:

  schedule:
    # Every day at 8:00 AM New York time during daylight saving time
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: hugo-dem2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser pyyaml

      - name: Update papers
        run: |
          python scripts/update_papers.py

      - name: Commit updated paper list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/papers.json

          if git diff --cached --quiet; then
            echo "No new papers"
          else
            git commit -m "Update paper feed"
            git push origin HEAD:hugo-dem2
          fi
